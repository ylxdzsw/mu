[package]
name = "mu"
version = "0.6.0"
edition = "2024"
rust-version = "1.100"
description = "Small composable agent runtime for the terminal"
repository = "https://github.com/ylxdzsw/mu"
license = "MIT"

[features]
default = []
portable = ["reqwest/native-tls-vendored"]

[dependencies]
aho-corasick = "1.1.5"
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
jsonc-parser = { version = "0.34.0", features = ["serde"] }
libc = "0.2.191"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
pulldown-cmark = "0.13.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", default-features = false, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
async-trait = "0.1.92"
unicode-width = "0.2.3"
unicode-segmentation = "1.13.3"

[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"

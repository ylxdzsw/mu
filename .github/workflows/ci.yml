name: CI

on:
  push:
    branches: ["msys2-v*"]
  pull_request:
    branches: ["msys2-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PYTHONUTF8: "1"

jobs:
  windows:
    name: Windows MSYS2 UCRT64
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Keep checkout line endings unchanged
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /v AllowDevelopmentWithoutDevLicense /t REG_DWORD /d 1 /f

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: minimal
          install: >-
            base-devel git zsh
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-jq
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-ripgrep
            mingw-w64-ucrt-x86_64-curl

      - name: Verify native UCRT64 toolchain
        run: |
          test "$MSYSTEM" = UCRT64
          test "$(command -v cargo)" = /ucrt64/bin/cargo
          rustc -vV
          cargo -V

      - name: Check formatting and lint
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features portable -- -D warnings

      - name: Test native and portable builds
        run: |
          cargo test -- --test-threads=1
          cargo test --features portable -- --test-threads=1

      - name: Test zsh integration
        if: ${{ !cancelled() }}
        run: |
          zsh -n mu.zsh test.zsh
          MU_ZSH_SKIP_PTY=1 zsh test.zsh

      - name: Build and test portable distribution
        if: ${{ !cancelled() }}
        run: |
          cargo build --release --features portable
          python test.windows.py target/release/mu.exe
          mkdir -p dist
          cp target/release/mu.exe dist/mu-windows-x86_64-msys2-ucrt64.exe
          cp mu.zsh WINDOWS.md dist/
          git rev-parse HEAD > dist/SOURCE_COMMIT
          sha256sum dist/*.exe > dist/SHA256SUMS

      - name: Build and install UCRT64 package
        if: ${{ !cancelled() }}
        run: |
          mkdir -p dist
          export MU_SOURCE_URL="file://$(cygpath -m "$GITHUB_WORKSPACE")"
          export MU_SOURCE_COMMIT="$(git rev-parse HEAD)"
          cd packaging/msys2
          makepkg --noconfirm --cleanbuild --clean --force
          package=$(find . -maxdepth 1 -name 'mingw-w64-ucrt-x86_64-mu-*.pkg.tar.zst' -print -quit)
          test -n "$package"
          pacman --noconfirm -U "$package"
          cp "$package" ../../dist/
          cd ../..
          python test.windows.py /ucrt64/bin/mu.exe

      - name: Upload Windows build for manual release attachment
        uses: actions/upload-artifact@v7
        with:
          name: windows-msys2-ucrt64-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
